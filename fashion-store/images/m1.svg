  <path d="M142 132 C146 155 149 177 151 196" stroke="#5a6852" stroke-width="1" stroke-dasharray="3 3" opacity="0.4" fill="none"/>
  <path d="M258 132 C254 155 251 177 249 196" stroke="#5a6852" stroke-width="1" stroke-dasharray="3 3" opacity="0.4" fill="none"/>

