  <path d="M240 122 C243 133 239 145 230 156 L221 166" stroke="#5a6852" stroke-width="1" stroke-dasharray="3 3" opacity="0.45" fill="none"/>
  <path d="M197 118 C194 136 188 156 180 170" stroke="#4c5945" stroke-width="1" opacity="0.5" fill="none"/>
  <path d="M203 118 C206 136 212 156 220 170" stroke="#4c5945" stroke-width="1" opacity="0.5" fill="none"/>

  <!-- hem stitch -->
  <path d="M150 397 C172 402 228 402 250 397" stroke="#5a6852" stroke-width="1" stroke-dasharray="3 3" opacity="0.5" fill="none"/>
</svg>
