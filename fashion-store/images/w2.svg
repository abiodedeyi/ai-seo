<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f7f1e6"/><stop offset="1" stop-color="#e9decb"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.26" r="0.7">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="ground" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#3a2f24" stop-opacity="0.30"/><stop offset="0.65" stop-color="#3a2f24" stop-opacity="0.12"/><stop offset="1" stop-color="#3a2f24" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="coatBody" x1="0.1" y1="0" x2="0.95" y2="1">
    <stop offset="0" stop-color="#c9a271"/><stop offset="0.5" stop-color="#b08a5a"/><stop offset="1" stop-color="#846030"/>
  </linearGradient>
  <linearGradient id="lapelG" x1="0" y1="0" x2="0.7" y2="1">
    <stop offset="0" stop-color="#d5b183"/><stop offset="1" stop-color="#9d7540"/>
  </linearGradient>
  <linearGradient id="sleeveLG" x1="0" y1="0" x2="1" y2="0.4">
    <stop offset="0" stop-color="#c19664"/><stop offset="1" stop-color="#7d5a2c"/>
  </linearGradient>
  <linearGradient id="sleeveRG" x1="1" y1="0" x2="0" y2="0.4">
    <stop offset="0" stop-color="#b78c5a"/><stop offset="1" stop-color="#755327"/>
  </linearGradient>
  <linearGradient id="beltG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#c39a68"/><stop offset="0.5" stop-color="#9d7442"/><stop offset="1" stop-color="#7a5626"/>
  </linearGradient>
  <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#8a6a2f"/><stop offset="0.4" stop-color="#d4a94e"/><stop offset="0.65" stop-color="#f7e7b0"/><stop offset="1" stop-color="#d4a94e"/>
  </linearGradient>
  <radialGradient id="horn" cx="0.35" cy="0.3" r="0.9">
    <stop offset="0" stop-color="#7a5c3a"/><stop offset="0.45" stop-color="#57402a"/><stop offset="0.8" stop-color="#33241a"/><stop offset="1" stop-color="#241811"/>
  </radialGradient>
  <filter id="soft2" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2"/></filter>
  <filter id="soft4" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
  <filter id="soft8" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="8"/></filter>
  <filter id="noiseF" x="0%" y="0%" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.24  0 0 0 0 0.16  0 0 0 0 0.07  0 0 0 0.5 0"/>
  </filter>
  <mask id="gm">
    <path d="M141,102 C160,92 240,92 259,102 C266,150 272,220 276,300 C279,360 281,405 282,428 C240,442 160,442 118,428 C119,405 121,360 124,300 C128,220 134,150 141,102 Z" fill="#fff"/>
    <path d="M141,102 C126,116 116,150 111,200 C108,240 106,275 107,300 C117,310 138,310 146,302 C147,260 148,190 152,140 Z" fill="#fff"/>
    <path d="M259,102 C274,116 284,150 289,200 C292,240 294,275 293,300 C283,310 262,310 254,302 C253,260 252,190 248,140 Z" fill="#fff"/>
  </mask>
</defs>

<rect width="400" height="500" fill="url(#bg)"/>
<rect width="400" height="500" fill="url(#glow)"/>
<ellipse cx="200" cy="452" rx="160" ry="22" fill="url(#ground)"/>

