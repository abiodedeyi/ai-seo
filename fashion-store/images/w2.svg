<path d="M154,150 C165,155 176,160 184,166" fill="none" stroke="#6f4f28" stroke-width="1" opacity="0.35" stroke-dasharray="3 3"/>
<path d="M246,150 C235,155 224,160 216,166" fill="none" stroke="#6f4f28" stroke-width="1" opacity="0.35" stroke-dasharray="3 3"/>
