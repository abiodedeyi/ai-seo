  <circle cx="223.5" cy="209.5" r="1.6" fill="#ffffff" opacity="0.85"/>
  <circle cx="176" cy="240" r="7.5" fill="url(#horn)"/>
  <circle cx="176" cy="240" r="7.5" fill="none" stroke="#1d1209" stroke-width="0.8" opacity="0.5"/>
  <circle cx="173.5" cy="237.5" r="1.6" fill="#ffffff" opacity="0.85"/>
