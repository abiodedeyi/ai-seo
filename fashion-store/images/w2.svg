<path d="M134,320 L184,322 C186,328 186,334 184,338 L134,336 C132,330 132,325 134,320 Z" fill="url(#lapelG)"/>
<path d="M266,320 L216,322 C214,328 214,334 216,338 L266,336 C268,330 268,325 266,320 Z" fill="url(#lapelG)"/>
<path d="M136,322 L182,324" fill="none" stroke="#6f4f28" stroke-width="1" opacity="0.35" stroke-dasharray="3 3"/>
<path d="M264,322 L218,324" fill="none" stroke="#6f4f28" stroke-width="1" opacity="0.35" stroke-dasharray="3 3"/>

<!-- hem stitch -->
