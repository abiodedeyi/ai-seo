<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f7f1e6"/><stop offset="1" stop-color="#e9decb"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.26" r="0.7">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="ground" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#3a2f24" stop-opacity="0.30"/><stop offset="0.65" stop-color="#3a2f24" stop-opacity="0.12"/><stop offset="1" stop-color="#3a2f24" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="bodiceG" x1="0" y1="0" x2="1" y2="0.9">
    <stop offset="0" stop-color="#c9713e"/><stop offset="0.5" stop-color="#a54f26"/><stop offset="1" stop-color="#7f3b18"/>
  </linearGradient>
  <linearGradient id="skirtG" x1="0.15" y1="0" x2="0.9" y2="1">
    <stop offset="0" stop-color="#b95f30"/><stop offset="0.55" stop-color="#9c4a22"/><stop offset="1" stop-color="#763514"/>
  </linearGradient>
  <linearGradient id="panelG" x1="0" y1="0" x2="0.9" y2="1">
    <stop offset="0" stop-color="#c76e3b"/><stop offset="0.55" stop-color="#a54f26"/><stop offset="1" stop-color="#84401b"/>
  </linearGradient>
  <linearGradient id="sleeveLG" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#c06336"/><stop offset="1" stop-color="#7c3917"/>
  </linearGradient>
  <linearGradient id="sleeveRG" x1="1" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b25a2c"/><stop offset="1" stop-color="#733413"/>
  </linearGradient>
  <linearGradient id="sashG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#c26a38"/><stop offset="0.5" stop-color="#9a4a22"/><stop offset="1" stop-color="#7a3715"/>
  </linearGradient>
  <linearGradient id="vintG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#823c19"/><stop offset="1" stop-color="#521d09"/>
  </linearGradient>
  <filter id="soft2" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2"/></filter>
  <filter id="soft4" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
  <filter id="soft8" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="8"/></filter>
  <filter id="noiseF" x="0%" y="0%" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.20  0 0 0 0 0.09  0 0 0 0 0.04  0 0 0 0.5 0"/>
  </filter>
  <mask id="gm">
    <path d="M150,206 L250,206 C263,262 281,330 292,406 C258,424 142,424 108,406 C119,330 137,262 150,206 Z" fill="#fff"/>
    <path d="M152,206 C146,168 143,128 149,104 C163,95 180,92 200,92 C220,92 237,95 251,104 C257,128 254,168 248,206 Z" fill="#fff"/>
    <path d="M150,104 C133,112 115,132 103,161 C97,176 95,189 98,199 C108,207 124,206 133,198 C139,178 144,148 151,126 Z" fill="#fff"/>
    <path d="M250,104 C267,112 285,132 297,161 C303,176 305,189 302,199 C292,207 276,206 267,198 C261,178 256,148 249,126 Z" fill="#fff"/>
  </mask>
</defs>

<rect width="400" height="500" fill="url(#bg)"/>
<rect width="400" height="500" fill="url(#glow)"/>
<ellipse cx="200" cy="450" rx="155" ry="22" fill="url(#ground)"/>

<!-- contact shadow -->
<g filter="url(#soft8)" opacity="0.20">
  <path d="M152,104 L248,104 L256,206 L290,410 C250,426 150,426 110,410 L144,206 Z" fill="#3a2f24" transform="translate(5,11)"/>
</g>

<!-- sleeves -->
<path d="M150,104 C133,112 115,132 103,161 C97,176 95,189 98,199 C108,207 124,206 133,198 C139,178 144,148 151,126 Z" fill="url(#sleeveLG)"/>
<g filter="url(#soft2)">
  <path d="M116,140 C108,158 102,176 100,192" fill="none" stroke="#5e2a12" stroke-width="6" stroke-linecap="round" opacity="0.16"/>
  <path d="M130,122 C120,143 112,166 108,188" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.14"/>
</g>
<path d="M250,104 C267,112 285,132 297,161 C303,176 305,189 302,199 C292,207 276,206 267,198 C261,178 256,148 249,126 Z" fill="url(#sleeveRG)"/>
