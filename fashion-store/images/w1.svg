  <path d="M284,140 C292,158 298,176 300,192" fill="none" stroke="#521d09" stroke-width="6" stroke-linecap="round" opacity="0.18"/>
  <path d="M270,122 C280,143 288,166 292,188" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.10"/>
</g>

<!-- skirt (under layer) -->
<path d="M150,206 L250,206 C263,262 281,330 292,406 C258,424 142,424 108,406 C119,330 137,262 150,206 Z" fill="url(#skirtG)"/>
